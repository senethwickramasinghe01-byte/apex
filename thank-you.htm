<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Apex Digital Agency</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- 🟢 STEP 1: PASTE YOUR GTM "HEAD" CODE RIGHT BELOW THIS LINE 🟢 -->
    
    <!-- 🟢 -------------------------------------------------------- 🟢 -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            padding: 20px;
        }
        .thank-you-box {
            background: white;
            color: #1f2937;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 500px;
        }
        h1 { color: #2563eb; margin-bottom: 20px; font-size: 36px; }
        p { margin-bottom: 30px; font-size: 18px; color: #4b5563; }
        .btn {
            background-color: #f59e0b;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .btn:hover { background-color: #d97706; }
    </style>
</head>
<body>

    <!-- 🟢 STEP 2: PASTE YOUR GTM "BODY" CODE RIGHT BELOW THIS LINE 🟢 -->
    
    <!-- 🟢 -------------------------------------------------------- 🟢 -->

    <div class="thank-you-box">
        <h1>Audit Requested! 🎉</h1>
        <p>Thank you for reaching out to Apex Digital Agency. One of our growth strategists will review your site and email you within 24 hours.</p>
        <a href="index.html" class="btn">Back to Homepage</a>
    </div>

</body>
</html>
